<style>

<body>
<h1>Gone Fishing: Pixel Edition</h1>
<div class="bar"><button id="snd">Sound: on</button><button id="fsb">Full screen</button></div>
<canvas id="c" width="320" height="180" tabindex="0"></canvas>
<p>Hold to charge your cast, release to throw (a full meter casts automatically). When the float dips, tap quickly. Then hold to reel and let go to ease the tension. Ten casts make a day.</p>
<p>An unofficial fan tribute to a gentle fishing show. Not affiliated with its makers.</p>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;
cv.addEventListener('contextmenu',e=>e.preventDefault());
let K=0;
function fit(){const r=cv.getBoundingClientRect(),n=Math.min(8,Math.max(1,Math.ceil(r.width*(window.devicePixelRatio||1)/320)));if(n!==K){K=n;cv.width=320*K;cv.height=180*K}}
let SIL=false;const R=(x,y,w,h,c)=>{g.fillStyle=SIL?'#0b0b10':c;g.fillRect(Math.round(x),Math.round(y),w,h)};
const T=(s,x,y,c='#fff',sz=8,al='left')=>{g.font='bold '+sz+'px "Courier New",monospace';g.textAlign=al;g.fillStyle='#000';g.fillText(s,x+1,y+1);g.fillStyle=c;g.fillText(s,x,y)};
function loadGame(){try{const s=JSON.parse(localStorage.getItem('gonefishing.v1'));if(s&&s.c)return s}catch(e){}return{c:{}}}
function saveGame(){try{localStorage.setItem('gonefishing.v1',JSON.stringify(SAVE))}catch(e){}}
let SAVE=loadGame();
function recordCatch(f){const e=SAVE.c[f.n],nw=!e;SAVE.c[f.n]={n:(e?e.n:0)+1,b:Math.max(e?e.b:0,f.wt)};saveGame();return nw}
const FISH=[
{n:'Roach',pull:20,c:'#b8c4cc',w:10,h:5},{n:'Rudd',pull:20,c:'#c9b46a',w:10,h:5},{n:'Perch',pull:28,c:'#6e9a3c',w:12,h:6},{n:'Bream',pull:30,c:'#a89a6a',w:13,h:8},{n:'Tench',pull:38,c:'#4f6b3a',w:14,h:7},{n:'Common Carp',pull:50,c:'#c9892e',w:18,h:8},
{n:'Dace',pull:18,c:'#cbd4d8',w:10,h:4},{n:'Chub',pull:32,c:'#7a8a5a',w:14,h:6},{n:'Barbel',pull:42,c:'#9a8a5a',w:16,h:6},{n:'Grayling',pull:30,c:'#8a8aa0',w:13,h:5},
{n:'Brown Trout',pull:34,c:'#8a7a4a',w:14,h:6},{n:'Sea Trout',pull:44,c:'#aab8c4',w:16,h:6},
{n:'Mackerel',pull:25,c:'#4a7a8a',w:12,h:4},{n:'Haddock',pull:34,c:'#7a7a82',w:15,h:6},{n:'Saithe',pull:40,c:'#4a5a4a',w:16,h:6},{n:'Cod',pull:48,c:'#8a7a50',w:18,h:8},
{n:'Mirror Carp',pull:58,c:'#b8862e',w:28,h:12,big:true},{n:'Pike',pull:58,c:'#7a8f4a',w:30,h:7,big:true},{n:'Atlantic Salmon',pull:60,c:'#9fb0c0',w:32,h:9,big:true},{n:'Atlantic Halibut',pull:62,c:'#7a6a55',w:44,h:12,big:true}];

const WT={Roach:[.3,1.5],Rudd:[.3,2],Perch:[.5,3],Bream:[1,8],Tench:[2,8],'Common Carp':[4,20],Dace:[.2,1.2],Chub:[1,6],Barbel:[2,14],Grayling:[.5,3],'Brown Trout':[.8,6],'Sea Trout':[2,12],Mackerel:[.5,2.5],Haddock:[2,12],Saithe:[3,20],Cod:[4,40],'Mirror Carp':[40,65],Pike:[20,35],'Atlantic Salmon':[28,55],'Atlantic Halibut':[150,300]};
const FISH_OLD=[
{n:'Roach',p:10,pull:20,c:'#b8c4cc',w:10,h:5},
{n:'Perch',p:15,pull:28,c:'#6e9a3c',w:12,h:6},
{n:'Tench',p:25,pull:38,c:'#4f6b3a',w:14,h:7},
{n:'Carp',p:40,pull:50,c:'#c9892e',w:18,h:8},
{n:'Pike',p:60,pull:65,c:'#7a8f4a',w:24,h:5},
{n:'Giant Catfish',p:120,pull:80,c:'#5a5560',w:28,h:9},
{n:'Old Boot',p:1,pull:5,c:'#5b3b22',w:9,h:8},
{n:'Barbel',p:0,pull:40,c:'#9a8a5a',w:16,h:6},{n:'Salmon',p:0,pull:52,c:'#9fb0c0',w:20,h:7},{n:'Cod',p:0,pull:48,c:'#8a7a50',w:18,h:8},{n:'Mackerel',p:0,pull:25,c:'#4a7a8a',w:12,h:4}];
const TIP={x:104,y:68},WATER=100;
let S='menu',power=0,dir=1,held=false,t=0,time=0,casts=10,score=0,bob={x:TIP.x,y:80},tgt={x:150,y:112},deep=0,fish=null,prog=0,ten=0,thr=0,thrT=1,msg='',msgT=0,tally={},best=null,hookT=0;
let AC=null,master=null,muted=false,tickT=0,relDone=false,backA=1,laugh=0,angry=0,angryT=3,dogT=8+Math.random()*20,dogX=-20,dogOn=false,bigT=0,loc=0,relG=-1,collTab=0,cfPrev='idle';
function initAudio(){
 if(AC){if(AC.state==='suspended')AC.resume();return}
 try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 master=AC.createGain();master.gain.value=muted?0:.6;master.connect(AC.destination);
 const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let l=0;
 for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}
 const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
 const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=700;
 const ng=AC.createGain();ng.gain.value=.25;src.connect(f);f.connect(ng);ng.connect(master);src.start();

}
function tone(fr,dur,type='sine',vol=.2,at=0,slide=0){
 if(!AC)return;const t0=AC.currentTime+at,o=AC.createOscillator(),gn=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(fr,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,fr+slide),t0+dur);
 gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(vol,t0+.01);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);
 o.connect(gn);gn.connect(master);o.start(t0);o.stop(t0+dur+.05)}
function noise(dur,vol,fr,at=0){
 if(!AC)return;const n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
 const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=fr;
 const gn=AC.createGain();gn.gain.value=vol;s.connect(fl);fl.connect(gn);gn.connect(master);s.start(AC.currentTime+at)}
const PENT=[261.6,293.7,329.6,392,440,523.3,587.3];
function melody(){if(muted||document.hidden||!AC||Math.random()<.3)return;tone(PENT[Math.floor(Math.random()*PENT.length)],1.4,'triangle',.06)}
function birds(){setTimeout(()=>{if(!muted&&!document.hidden&&AC){const b=1800+Math.random()*1200,n=2+Math.floor(Math.random()*3);for(let i=0;i<n;i++)tone(b+i*150,.09,'sine',.04,i*.12,400)}birds()},3000+Math.random()*6000)}
function sfx(k){
 if(!AC||muted)return;
 if(k==='cast')noise(.35,.5,1200);
 else if(k==='splash'){noise(.45,.7,600);tone(300,.2,'sine',.15,0,-150)}
 else if(k==='bite'){tone(880,.12,'square',.12);tone(1175,.18,'square',.12,.12)}
 else if(k==='hook')tone(220,.15,'sawtooth',.15,0,200);
 else if(k==='tick')tone(300+Math.min(ten,100)*6,.04,'square',.05);
 else if(k==='thrash')noise(.3,.4,500);
 else if(k==='catch')[523.3,659.3,784,1046.5].forEach((f,i)=>tone(f,.25,'square',.1,i*.1));
 else if(k==='boot'){tone(200,.2,'sawtooth',.12);tone(140,.35,'sawtooth',.12,.2)}
 else if(k==='snap'){noise(.15,.7,3000);tone(600,.2,'sawtooth',.12,0,-400)}
 else if(k==='miss')tone(300,.3,'triangle',.15,0,-150);
 else if(k==='grr'){tone(140,.25,'sawtooth',.1,0,-40);tone(120,.3,'sawtooth',.1,.25,-30)}
 else if(k==='laugh')[.15,.28,.45,.58].forEach((d,i)=>tone(i%2?520:620,.09,'square',.07,d,-80));
 else if(k==='end')[392,523.3,659.3,784].forEach((f,i)=>tone(f,.5,'triangle',.15,i*.18));
}
const WTOLD={Roach:[.3,1.5],Perch:[.5,3],Tench:[2,8],Carp:[5,30],Pike:[5,35],'Giant Catfish':[40,120],'Old Boot':[0,0],'Giant Halibut':[180,260],Barbel:[2,14],Salmon:[5,25],Cod:[4,40],Mackerel:[.5,2.5]};
const BIG={n:'Giant Halibut',p:0,pull:58,c:'#7a6a55',w:44,h:12,big:true};
function bigOK(){return dogOn&&dogX>-8&&dogX<318&&Math.abs(deep-.5)<.07&&Math.random()<.25}
function mk(f){const [a,b]=WT[f.n],fr=Math.random();return {...f,wt:a+fr*(b-a),pull:f.pull*(.75+.5*fr)}}
function pick(d){const F=LOCS[loc].f,w=FISH.map(f=>{const a=F[f.n];return typeof a==='function'?a(d):(a||0)});let s=w.reduce((a,b)=>a+b),r=Math.random()*s;for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return FISH[i]}return FISH[0]}
function down(){initAudio();
 if(S==='idle'){S='charge';power=0;dir=1}
 else if(S==='wait'){say('Too soon. Reeled in.');spend()}
 else if(S==='bite'){S='reel';sfx('hook');fish=mk(bigOK()?BIGS[loc]:pick(deep));if(fish.big){bigT=3.4;sfx('bite')}else{sfx('laugh');laugh=2.2}prog=25;ten=20;thr=0;thrT=1}
 else if(S==='end'&&t>1){casts=10;score=0;tally={};best=null;S='menu'}
 held=true}
function up(){
 if(S==='charge'){S='cast';sfx('cast');backA=.26+power*1.7;t=0;deep=power;tgt={x:150+power*150,y:108+power*28}}
 held=false}
function say(m){msg=m;msgT=2}
function spend(){casts--;if(casts<=0)setTimeout(()=>sfx('end'),1200);S=casts<=0?'end':'idle';t=0;bob={x:TIP.x,y:80}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(S==='menu'){pickLoc(e);return}if(S==='coll'){pickColl(e);return}if((S==='idle'||S==='wait')&&hitEnd(e)){cfPrev=S;S='confirm';return}if(S==='confirm'){pickConfirm(e);return}down()});
addEventListener('pointerup',up);
addEventListener('keydown',e=>{if(S==='coll'){if(/^Digit[1-4]$/.test(e.code))collTab=+e.code.slice(5)-1;else S='menu';return}if(S==='menu'){if(e.code==='KeyC'){S='coll';return}if(/^Digit[1-4]$/.test(e.code)){initAudio();startLoc(+e.code.slice(5)-1)}return}if(e.code==='Space'&&!e.repeat){e.preventDefault();down()}});
addEventListener('keyup',e=>{if(e.code==='Space')up()});
function update(dt){
 time+=dt;t+=dt;if(msgT>0)msgT-=dt;if(laugh>0)laugh-=dt;if(angry>0)angry-=dt;if(bigT>0)bigT-=dt;if(S!=='reel')bigT=0;if(S!=='end'){if(!dogOn){dogT-=dt;if(dogT<=0){dogOn=true;dogX=-14}}else{dogX+=16*dt;if(dogX>334){dogOn=false;dogT=20+Math.random()*30}}}if(S!=='reel')angry=0;else{angryT-=dt;if(angryT<=0&&angry<=0&&laugh<=0&&bigT<=0&&ten>75){angry=1.8;angryT=2+Math.random()*3;sfx('grr')}}if(S==='idle'||S==='charge'){bob.x=TIP.x;bob.y=TIP.y+12}
 if(S==='charge'){power+=dt*1.1;if(power>=1){power=1;up()}}
 if(S==='cast'){const k=Math.min(t/.7,1);bob.x=TIP.x+(tgt.x-TIP.x)*k;bob.y=TIP.y+(tgt.y-TIP.y)*k-Math.sin(Math.PI*k)*28;if(k>=1){S='wait';sfx('splash');t=0;hookT=1.4+Math.random()*3}}
 if(S==='wait'&&t>hookT){S='bite';sfx('bite');t=0}
 if(S==='bite'&&t>.9){say('It got away!');sfx('miss');spend()}
 if(S==='reel'){
  thrT-=dt;if(thrT<=0){thr=thr>0?0:.5;thrT=thr>0?.5:.5+Math.random()*1.1;if(thr>0)sfx('thrash')}
  if(held){prog+=26*dt*(1-ten/140);ten+=42*dt;tickT-=dt;if(tickT<=0){sfx('tick');tickT=Math.max(.05,.16-ten/900)}}else{ten-=45*dt;prog-=3*dt}
  if(thr>0)ten+=fish.pull*1.1*dt;
  ten=Math.max(0,ten);{const k=Math.max(0,Math.min(1,prog/100)),wx=tgt.x+(138-tgt.x)*k,wy=tgt.y+(106-tgt.y)*k,f=Math.min(1,dt*8);bob.x+=(wx-bob.x)*f;bob.y+=(wy-bob.y)*f}
  if(ten>=100){say('Snap! Line broke.');sfx('snap');S='snapped';t=0}
  else if(prog<=0){say('Lost it...');sfx('miss');spend()}
  else if(prog>=100){score+=fish.wt;(tally[fish.n]=tally[fish.n]||[]).push(fish.wt);if(!best||fish.wt>best.wt)best=fish;const nw=recordCatch(fish);say((nw?'NEW! ':'')+fish.wt.toFixed(1)+' lb '+fish.n+'!');sfx('catch');S='release';t=0;relDone=false;relG=-1}
 }
 if(S==='release'){if(!relDone&&t>.5){relDone=true;sfx('splash')}if(relG<0&&relX(t)-Math.round(fish.w/2)>=322)relG=t;if(relG>=0&&t>relG+(fish.big?4:0)){relDone=false;spend()}}
 if(S==='snapped'&&t>2.6)spend();
 if(S==='end'&&t<0)t=0;
}
const LOCS=[
{n:'Norfolk Lakes',s:'Tench, bream, carp',sk:['#9fd3e8','#aedaec','#bfe2ef','#cfe9f1','#e0f0f0'],hl:['#7fae7a','#6b9c68'],bk:'#4f7d4a',wt:['#3b86a8','#357b9c','#4592b5'],rp:'#9fd3e8',f:{Roach:d=>4-2*d,Rudd:3,Perch:3,Bream:d=>2+d*2,Tench:d=>2+2*d,'Common Carp':d=>d>.35?1.8:.4}},
{n:'River Wye',s:'Barbel, chub, pike',sk:['#a7d1e6','#b8dcea','#c8e5ee','#d8edf0','#e8f4ee'],hl:['#6fa35e','#5b9150'],bk:'#4a7a3e',wt:['#4a8a78','#437f6e','#55998a'],rp:'#b5dccf',f:{Roach:3,Dace:3,Chub:d=>2+d,Barbel:d=>2+2*d,Grayling:2}},
{n:'River Tay',s:'Trout and salmon',sk:['#8fa9c4','#a2b8cf','#b5c7d8','#c8d5e0','#d9e2e8'],hl:['#6a6a8a','#555a7a'],bk:'#4a5a3a',wt:['#34607a','#2e566f','#3f6e8a'],rp:'#a8c4d8',f:{'Brown Trout':3,'Sea Trout':d=>1+2*d,Grayling:2.5,Perch:2}},
{n:'Lofoten, Norway',s:'Cod and halibut',sk:['#6f86b0','#8a9cc4','#a8b4d4','#c4c8de','#dcd8e4'],hl:['#d8e0ea','#b8c4d4'],bk:'#e6edf2',wt:['#27466e','#223f63','#2f5280'],rp:'#7fa0c8',f:{Mackerel:d=>4-2*d,Haddock:3,Saithe:d=>2+d,Cod:d=>2+3*d}}

function tri(cx,by,h,hw,c){for(let i=0;i<h;i++){const w=Math.round(hw*(i+1)/h);R(cx-w,by-h+i,w*2,1,c)}}
function startLoc(i){loc=i;casts=10;score=0;tally={};best=null;S='idle';t=0;dogOn=false;dogT=8+Math.random()*20;msgT=0;laugh=0;angry=0;bigT=0;sfx('splash')}

function drawConfirm(){
 R(0,0,320,180,'rgba(0,0,0,.55)');
 R(66,48,188,84,'#fff');R(67,49,186,82,'#1c3248');
 T('End the day?',160,68,'#ffe14a',11,'center');

 btn(84,98,68,20,'End day','#c0392b',8);btn(168,98,68,20,'Keep fishing','#2e8b4a',8);
}
function pickConfirm(e){const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*320,py=(e.clientY-r.top)/r.height*180;if(py>=96&&py<=122){if(px>=84&&px<=152)endDay();else if(px>=168&&px<=236){S=cfPrev;if(S==='wait')t=0}}}

function drawColl(){

 const short=['Norfolk','Wye','Tay','Norway'];
 LOCS.forEach((P,i)=>{const x=4+i*79,sel=i===collTab,nm=Object.keys(P.f).concat(BIGS[i].n),got=nm.filter(n=>SAVE.c[n]).length;

 T(P.n,160,43,'#fff',8,'center');
 names.forEach((nm,i)=>{const f=FISH.find(q=>q.n===nm),e=SAVE.c[nm],x=4+(i%4)*79,y=47+Math.floor(i/4)*58;
